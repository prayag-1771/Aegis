[project]
name = "aegis-counterfeit-vision"
version = "0.1.0"
description = "Aegis Counterfeit Vision — fake-currency detection (CNN transfer learning + OpenCV security-feature checks)"
authors = [{ name = "Adharshan" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    # HEADLESS, not plain opencv-python: the GUI build links libGL, which is
    # absent from slim Linux containers, so `import cv2` dies at boot with
    # "libGL.so.1: cannot open shared object file". This module never calls
    # imshow/waitKey (verified), so the GUI build buys nothing and costs a
    # deployment.
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "numpy>=1.26",
    "scipy>=1.13",
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.9",
    "jsonschema>=4.23",
    # Optional durable serial registry (Atlas). dnspython is declared explicitly
    # because pymongo 4.x dropped the [srv] extra, and mongodb+srv:// connection
    # strings need DNS SRV resolution. Both are unused when MONGODB_URI is unset
    # — the registry falls back to its JSON file.
    "pymongo>=4.9",
    "dnspython>=2.6",
    # REQUIRED, not optional: the Gemini and Groq legs of both the semantic
    # review (vision_agent) and the triage narrator (prescreen) import httpx.
    # It was undeclared and only present locally as a transitive/manual install,
    # so on a clean deploy every one of those calls raised ImportError straight
    # into a broad `except Exception` — the semantic layer would have reported
    # itself "unavailable" forever, silently, with a valid API key configured.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]
# Only needed to use Claude as the semantic reviewer. Gemini and Groq need
# nothing beyond httpx above, and with no key at all the layer reports itself
# unavailable rather than failing.
llm = [
    "anthropic>=0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_counterfeit"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
